[project]
name = "scamsense-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
